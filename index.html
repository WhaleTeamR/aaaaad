<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hahahahahahahahahahahahahahahahaha</title>
    <style>
        /* 1. Thiết lập cho toàn bộ trang web không bị thừa viền và ẩn thanh cuộn */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 2. Ép video phủ kín toàn bộ màn hình */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* 3. Định dạng CSS cho chữ nằm giữa và hiệu ứng biến mất */
        .welcome-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            color: red;
            font-weight: bold;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 999;
            transition: opacity 1s ease;
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- THÊM id="myVideo" VÀO THẺ VIDEO bên dưới -->
    <video id="myVideo" class="bg-video" autoplay muted loop playsinline>
        <source src="Rick Roll Link.mp4" type="video/mp4">
    </video>

    <div class="welcome-text"><b>YOU HAVE BEEN SCAMMED!!! KID</b></div>

<script>
    // 1. Tự động ẩn chữ sau 5 giây
    setTimeout(function() {
        const textElement = document.querySelector('.welcome-text');
        if (textElement) {
            textElement.style.opacity = '0';
            setTimeout(function() {
                textElement.remove();
            }, 1000);
        }
    }, 5000);

    // 2. Lấy đúng thẻ video qua id="myVideo"
    const video = document.getElementById('myVideo');

    // 3. Click bất kỳ đâu trên màn hình để bật tiếng ngay lập tức
    document.addEventListener('click', function() {
        if (video) {
            video.muted = false; // Tắt chế độ im lặng
            video.volume = 1.0;  // Âm lượng 100%
            video.play();        // Phát video
        }
    }, { once: true });
</script>
</body>
</html>
