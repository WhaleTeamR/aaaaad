<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Free Robux Claim</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; /* Nền toàn trang màu trắng */
        }

        /* 1. Mặc định ẨN HOÀN TOÀN video (display: none) */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            display: none; /* Video sẽ không xuất hiện khi chưa click */
        }

        /* 2. Mặc định ẨN HOÀN TOÀN dòng chữ scam */
        .welcome-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            color: red;
            font-weight: bold;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 99;
            transition: opacity 1s ease;
            opacity: 1;
            display: none; /* Chữ chỉ hiện sau khi click */
        }

        /* 3. LỚP PHỦ NỀN TRẮNG PHỦ KÍN MÀN HÌNH */
        #click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; /* Nền trắng tuyệt đối */
            color: #000000;            /* Dòng chữ màu đen */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-family: 'Inter', sans-serif;
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Lớp phủ màn hình trắng (chỉ duy nhất phần này xuất hiện ban đầu) -->
    <div id="click-overlay">
        <b>BẤM BẤT KỲ ĐÂU ĐỂ NHẬN 1000 ROBUX!</b>
    </div>

    <!-- Thẻ Video -->
    <video id="myVideo" class="bg-video" loop playsinline>
        <source src="Rick Roll Link.mp4" type="video/mp4">
    </video>

    <!-- Thẻ chữ Scam -->
    <div id="scamText" class="welcome-text"><b>YOU HAVE BEEN SCAMMED!!! KID</b></div>

<script>
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('click-overlay');
    const scamText = document.getElementById('scamText');

    overlay.addEventListener('click', function() {
        // 1. Biến mất màn hình trắng
        overlay.style.display = 'none';

        // 2. Hiện video và chữ Scam lên màn hình
        if (video) {
            video.style.display = 'block'; // Cho video xuất hiện
            video.muted = false;           // Bật tiếng
            video.volume = 1.0;            // Âm lượng 100%
            video.play();                  // Bắt đầu phát
        }
        
        if (scamText) {
            scamText.style.display = 'block'; // Cho chữ Scam xuất hiện
        }

        // 3. Đếm ngược 5 giây rồi mờ và ẩn dòng chữ Scam
        setTimeout(function() {
            if (scamText) {
                scamText.style.opacity = '0';
                setTimeout(function() {
                    scamText.remove();
                }, 1000);
            }
        }, 5000);
    });
</script>
</body>
</html>
