<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hahahahahahahahahahahahahahahahaha</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        .welcome-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            color: red;
            font-weight: bold;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 99;
            transition: opacity 1s ease;
            opacity: 1;
        }

        /* 1. LỚP PHỦ TẠO TƯƠNG TÁC (OVERLAY) */
        #click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7); /* Nền tối nhẹ */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-family: sans-serif;
            z-index: 9999; /* Đẩy lên trên cùng để bắt cú click đầu tiên */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Lớp phủ yêu cầu click -->
    <div id="click-overlay">
        <b>BẤM BẤT KỲ ĐÂU ĐỂ NHẬN 1000 ROBUX!</b>
    </div>

    <video id="myVideo" class="bg-video" autoplay muted loop playsinline>
        <source src="Rick Roll Link.mp4" type="video/mp4">
    </video>

    <div class="welcome-text"><b>YOU HAVE BEEN SCAMMED!!! KID</b></div>

<script>
    // Ẩn dòng chữ thông báo sau 5s
    setTimeout(function() {
        const textElement = document.querySelector('.welcome-text');
        if (textElement) {
            textElement.style.opacity = '0';
            setTimeout(function() {
                textElement.remove();
            }, 1000);
        }
    }, 5000);

    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('click-overlay');

    // 2. NGAY KHI NGƯỜI DÙNG BẤM VÀO LỚP PHỦ
    overlay.addEventListener('click', function() {
        if (video) {
            video.muted = false; // Mở tiếng ngay lập tức
            video.volume = 1.0;
            video.play();
        }
        overlay.style.display = 'none'; // Xóa lớp phủ đen đi để hiện video bên dưới
    });
</script>
</body>
</html>
